# Experiment configuration for the token tax study.
# Every remote artefact is pinned to an exact repository revision (commit sha).

dataset:
  # FLORES-200 devtest, wide format (one column per language, rows aligned).
  # The official repos (openlanguagedata/flores_plus, facebook/flores) are gated,
  # so we use the public MTEB mirror of the same FLORES-200 devtest split.
  repo_id: mteb/flores
  revision: 69edd3336d102dd184dd531b57defac6c9c60c8f
  filename: devtest.parquet
  licence: CC-BY-SA-4.0
  local_path: data/flores200_devtest.parquet

baseline: eng

languages:
  - {code: eng, name: English, flores: eng_Latn, group: reference}
  - {code: fra, name: French, flores: fra_Latn, group: european}
  - {code: deu, name: German, flores: deu_Latn, group: european}
  - {code: afr, name: Afrikaans, flores: afr_Latn, group: southern_african}
  - {code: zul, name: isiZulu, flores: zul_Latn, group: southern_african}
  - {code: xho, name: isiXhosa, flores: xho_Latn, group: southern_african}
  - {code: sot, name: Sesotho, flores: sot_Latn, group: southern_african}
  - {code: tsn, name: Setswana, flores: tsn_Latn, group: southern_african}
  - {code: sna, name: Shona, flores: sna_Latn, group: southern_african}
  - {code: swh, name: Swahili, flores: swh_Latn, group: southern_african}

# kind: "hf" loads tokenizer files only (no weights) with transformers.AutoTokenizer;
#       "tiktoken" loads a named encoding with the tiktoken library.
# word_prefix: string prepended when a single word is encoded in isolation, so that
#       it is tokenised the way it would be mid-sentence (byte-level BPE needs an
#       explicit space; SentencePiece models add a word-boundary marker themselves).
tokenizers:
  - {key: gpt2, label: GPT-2, kind: hf, repo_id: openai-community/gpt2,
     revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e, word_prefix: " "}
  - {key: cl100k, label: cl100k_base, kind: tiktoken, encoding: cl100k_base, word_prefix: " "}
  - {key: o200k, label: o200k_base, kind: tiktoken, encoding: o200k_base, word_prefix: " "}
  - {key: llama3, label: Llama 3.x, kind: hf, repo_id: unsloth/Llama-3.2-1B-Instruct,
     revision: 5a8abab4a5d6f164389b1079fb721cfab8d7126c, word_prefix: " ",
     note: "ungated mirror; upstream meta-llama/Llama-3.2-1B-Instruct is gated"}
  - {key: qwen25, label: Qwen 2.5, kind: hf, repo_id: Qwen/Qwen2.5-7B-Instruct,
     revision: a09a35458c702b33eeacc393d103063234e8bc28, word_prefix: " "}
  - {key: qwen3, label: Qwen 3, kind: hf, repo_id: Qwen/Qwen3-8B,
     revision: b968826d9c46dd6066d109eabc6255188de91218, word_prefix: " "}
  - {key: gemma2, label: Gemma 2, kind: hf, repo_id: unsloth/gemma-2-2b-it,
     revision: 457f2e15bf550c227ce6ad86e2ec108d3e42c106, word_prefix: " ",
     note: "ungated mirror; upstream google/gemma-2-2b-it is gated"}
  - {key: gemma3, label: Gemma 3, kind: hf, repo_id: unsloth/gemma-3-1b-it,
     revision: 5b11413a10db4e486ef16a20101fd028f8f2499c, word_prefix: " ",
     note: "ungated mirror; upstream google/gemma-3-1b-it is gated"}
  - {key: mistral, label: Mistral 7B v0.3, kind: hf, repo_id: mistralai/Mistral-7B-Instruct-v0.3,
     revision: c170c708c41dac9275d15a8fff4eca08d52bab71, word_prefix: ""}
  - {key: nemo, label: Mistral Nemo (Tekken), kind: hf, repo_id: mistralai/Mistral-Nemo-Instruct-2407,
     revision: 04d8a90549d23fc6bd7f642064003592df51e9b3, word_prefix: " "}
  - {key: bloom, label: BLOOM, kind: hf, repo_id: bigscience/bloom,
     revision: 7f10a99ce7c08f03c7719a586cb2cbda1433ac05, word_prefix: " "}
  - {key: mt5, label: mT5, kind: hf, repo_id: google/mt5-base,
     revision: 2eb15465c5dd7f72a8f7984306ad05ebc3dd1e1f, word_prefix: ""}
  - {key: xlmr, label: XLM-R, kind: hf, repo_id: FacebookAI/xlm-roberta-base,
     revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089, word_prefix: ""}
  - {key: afroxlmr, label: AfroXLMR, kind: hf, repo_id: Davlan/afro-xlmr-base,
     revision: 25f27299c247a6b73a767bd82d12444138b19337, word_prefix: ""}
  - {key: afriberta, label: AfriBERTa, kind: hf, repo_id: castorini/afriberta_large,
     revision: 231d92411ab8a99add67eda412ee948c74a4b179, word_prefix: ""}

skipped:
  - {repo_id: meta-llama/Llama-3.2-1B-Instruct, reason: "gated (manual approval); measured through the unsloth mirror instead"}
  - {repo_id: google/gemma-2-2b-it, reason: "gated (manual approval); measured through the unsloth mirror instead"}
  - {repo_id: google/gemma-3-1b-it, reason: "gated (manual approval); measured through the unsloth mirror instead"}
  - {repo_id: lelapa/InkubaLM-0.4B, reason: "gated (requires a Hugging Face login); no ungated copy found"}
  - {repo_id: openlanguagedata/flores_plus, reason: "dataset is gated; mteb/flores mirror used"}
  - {repo_id: facebook/flores, reason: "dataset is gated; mteb/flores mirror used"}

analysis:
  bootstrap_samples: 2000
  seed: 20231
  confidence: 0.95
  context_window: 8192
  # Tokenizers used for the bar chart and the morphology examples.
  headline_tokenizers: [o200k, llama3, gemma3]
  example_languages: [zul, xho]
  n_examples: 8
  min_example_chars: 12
  # Colour groups for the coverage scatter. Nguni languages and Shona are written
  # conjunctively (one long word per verb or noun phrase); Sotho-Tswana languages are
  # written disjunctively (prefixes and particles as separate short words).
  scatter_groups:
    - {label: "isiZulu, isiXhosa, Shona (conjunctive)", langs: [zul, xho, sna]}
    - {label: "Sesotho, Setswana (disjunctive)", langs: [sot, tsn]}
    - {label: "Afrikaans, Swahili, French, German", langs: [afr, swh, fra, deu]}
